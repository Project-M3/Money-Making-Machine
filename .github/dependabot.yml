version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      weekday: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    groups:
      rust-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/website"
    schedule:
      interval: "weekly"
      weekday: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "area/website"
    groups:
      website-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      weekday: "monday"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "area/ci"
    groups:
      github-actions:
        patterns:
          - "*"
