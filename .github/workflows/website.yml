name: Website

# Build verification only. Production deploys come from Cloudflare Workers
# Builds (connected to this repo, root directory /website); this workflow
# never deploys and needs no Cloudflare credentials.

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "scripts/install.sh"
      - ".github/workflows/website.yml"
  pull_request:
    paths:
      - "website/**"
      - "scripts/install.sh"
      - ".github/workflows/website.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml

      - name: Verify installer copy matches scripts/install.sh
        run: diff -u ../scripts/install.sh public/install.sh

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck, build and prerender (en + zh)
        run: pnpm build

      - name: Verify Cloudflare build output
        run: |
          out=.cloudflare/output/v1/workers/default
          test -f $out/../../config.json || test -f .cloudflare/output/v1/config.json
          test -f $out/assets/index.html
          test -f $out/assets/_i18n/zh.html
          test -f $out/assets/install.sh
          test -f $out/bundle/index.js
          grep -q 'lang="en"' $out/assets/index.html
          grep -q 'Read every filing.' $out/assets/index.html
          grep -q 'lang="zh-CN"' $out/assets/_i18n/zh.html
          grep -q '读遍每一份财报。' $out/assets/_i18n/zh.html
