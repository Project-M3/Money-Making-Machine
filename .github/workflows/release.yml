name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.3.0; defaults to v<apps/m3-nsh/Cargo.toml version>)"
        type: string
        required: false
        default: ""
      dry_run:
        description: "Build and verify manifest without publishing GitHub Release"
        type: boolean
        required: true
        default: true
      require_sign_macos:
        description: "Fail if Apple Developer ID signing/notarization secrets are missing"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Validate Version & Tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      commit_sha: ${{ steps.meta.outputs.commit_sha }}
      target_sha: ${{ steps.meta.outputs.target_sha }}
      should_publish: ${{ steps.meta.outputs.should_publish }}
      require_sign_macos: ${{ steps.meta.outputs.require_sign_macos }}
    steps:
      - uses: actions/checkout@v7

      - name: Resolve and validate release metadata
        id: meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          GITHUB_SHA: ${{ github.sha }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          INPUT_REQUIRE_SIGN_MACOS: ${{ inputs.require_sign_macos }}
        run: |
          python3 - <<'PY'
          import os, pathlib, tomllib

          cargo = tomllib.loads(pathlib.Path("apps/m3-nsh/Cargo.toml").read_text(encoding="utf-8"))
          version = cargo["package"]["version"].strip()
          if not version or version.startswith("v"):
              raise SystemExit(f"Invalid Cargo.toml package.version: {version!r}")
          for crate_toml in ("crates/m3-core/Cargo.toml", "crates/m3-cli/Cargo.toml"):
              other_ver = tomllib.loads(pathlib.Path(crate_toml).read_text(encoding="utf-8"))["package"]["version"].strip()
              if other_ver != version:
                  raise SystemExit(f"{crate_toml} version {other_ver!r} != apps/m3-nsh/Cargo.toml {version!r}")

          expected_tag = f"v{version}"
          event_name = os.environ["EVENT_NAME"]
          ref = os.environ["REF"]
          ref_name = os.environ["REF_NAME"]
          target_sha = os.environ["GITHUB_SHA"].strip()
          commit_sha = target_sha[:7]
          input_tag = os.environ.get("INPUT_TAG", "").strip()
          dry_run = os.environ.get("INPUT_DRY_RUN", "true").lower() == "true"
          req_sign = os.environ.get("INPUT_REQUIRE_SIGN_MACOS", "false").lower() == "true"

          if event_name == "push" and ref.startswith("refs/tags/v"):
              tag = ref_name
              should_publish = True
          elif event_name == "workflow_dispatch":
              tag = input_tag or (ref_name if ref.startswith("refs/tags/v") else expected_tag)
              should_publish = not dry_run
          else:
              raise SystemExit(f"Unsupported trigger: {event_name} {ref}")

          if tag != expected_tag:
              raise SystemExit(f"Tag {tag!r} != expected {expected_tag!r} from Cargo.toml")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"version={version}\n")
              fh.write(f"tag={tag}\n")
              fh.write(f"commit_sha={commit_sha}\n")
              fh.write(f"target_sha={target_sha}\n")
              fh.write(f"should_publish={'true' if should_publish else 'false'}\n")
              fh.write(f"require_sign_macos={'true' if req_sign else 'false'}\n")
          PY

  release:
    needs: prepare
    uses: ./.github/workflows/_release-build.yml
    secrets: inherit
    with:
      version: ${{ needs.prepare.outputs.version }}
      tag: ${{ needs.prepare.outputs.tag }}
      channel: stable
      commit_sha: ${{ needs.prepare.outputs.commit_sha }}
      target_sha: ${{ needs.prepare.outputs.target_sha }}
      should_publish: ${{ needs.prepare.outputs.should_publish == 'true' }}
      require_sign_macos: ${{ needs.prepare.outputs.require_sign_macos == 'true' }}
