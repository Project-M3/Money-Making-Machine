[package]
name = "m3-nsh"
version = "0.6.0"
edition = "2024"
license = "Apache-2.0"
description = "Native macOS desktop workbench for M3 built on Longbridge NSH"
homepage = "https://m3.thinksmart.systems"
repository = "https://github.com/thinksmart-systems/m3"
publish = false

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
log = "0.4"
m3-cli = { path = "../../crates/m3-cli" }
m3-core = { path = "../../crates/m3-core" }
nsh-base = "0.7.0"
nsh-core = { version = "0.7.0", features = ["svg"] }
rust_decimal = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
tokio = { version = "1", features = ["sync", "macros"] }

[target.'cfg(target_os = "macos")'.dependencies]
nsh-platform-macos = { version = "0.7.0", default-features = false, features = ["plot", "svg"] }
