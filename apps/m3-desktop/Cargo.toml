[package]
name = "m3-desktop"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1"
gpui = { version = "=0.2.2", default-features = false, features = ["font-kit", "runtime_shaders"] }
log = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "gzip", "json", "rustls-tls"] }
rust_decimal = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[profile.dev]
debug = 0
