[package]
name = "m3-cli"
version = "0.4.2"
edition = "2024"
license = "Apache-2.0"
description = "JSON-first command-line interface for Project M3 (Munger Workbench)"
homepage = "https://m3.thinksmart.systems"
repository = "https://github.com/Project-M3/Money-Making-Machine"
publish = false

[[bin]]
name = "m3"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
m3-core = { path = "../m3-core" }
rust_decimal = "1"
serde_json = { version = "1", features = ["raw_value"] }
