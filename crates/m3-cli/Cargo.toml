[package]
name = "m3-cli"
version = "0.6.0"
edition = "2024"
license = "Apache-2.0"
description = "Agent-native schema-v1 JSON CLI and MCP server for M3"
homepage = "https://m3.thinksmart.systems"
repository = "https://github.com/thinksmart-systems/m3"
publish = false

[[bin]]
name = "m3"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
m3-core = { path = "../m3-core" }
rust_decimal = "1"
serde_json = { version = "1", features = ["raw_value"] }
